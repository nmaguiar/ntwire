<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ntwire server</title>
<style>
:root{color-scheme:light dark;--bg:#f7f9fc;--panel:#fff;--panel2:#eef4ff;--text:#162033;--muted:#607089;--brand:#246bfe;--strong:#174fc5;--accent:#10a37f;--danger:#c2410c;--border:#d9e2f1;--shadow:0 20px 60px #1620331f}@media(prefers-color-scheme:dark){:root{--bg:#0b1120;--panel:#111a2e;--panel2:#15223a;--text:#edf4ff;--muted:#9fb0ca;--brand:#79a7ff;--strong:#a9c5ff;--accent:#4ade80;--danger:#fb923c;--border:#263753;--shadow:0 20px 60px #00000059}}*{box-sizing:border-box}body{margin:0;min-height:100vh;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:radial-gradient(circle at top left,color-mix(in srgb,var(--brand) 18%,transparent),transparent 34rem),var(--bg)}main{width:min(72rem,calc(100% - 2rem));margin:auto;padding:3rem 0}.hero,.card{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow)}.hero{display:grid;gap:.45rem;padding:1rem;margin-bottom:.5rem}.eyebrow,.label{margin:0;color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.brand-lockup{display:flex;align-items:center;gap:.7rem}.brand-mark{width:2.25rem;height:2.25rem;filter:drop-shadow(0 .15rem .3rem color-mix(in srgb,var(--brand) 20%,transparent))}.brand-lockup h1{font-size:clamp(1.45rem,4vw,2.2rem);line-height:1.1;margin:0}.brand-nt{color:#008bff}.status-row{display:flex;flex-wrap:wrap;gap:.45rem}.badge{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--border);border-radius:999px;padding:.28rem .55rem;background:var(--panel2);font-size:.85rem;font-weight:700}.badge:before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--accent);box-shadow:0 0 0 .2rem color-mix(in srgb,var(--accent) 18%,transparent)}.tabs{position:sticky;top:0;z-index:10;display:flex;margin-bottom:1.25rem;padding:.75rem 0;background:linear-gradient(to bottom,var(--bg) 78%,transparent)}.tab{border:1px solid var(--border);border-radius:12px;padding:.5rem 1rem;background:var(--brand);color:var(--bg);font-weight:700}.grid{display:flex;flex-direction:column;gap:1rem;margin:0;padding:0;list-style:none}.card{padding:0}.card-head{display:flex;gap:.75rem;align-items:center;padding:1.1rem;cursor:pointer;list-style:none}.card-head::-webkit-details-marker{display:none}.card-head:focus-visible{outline:2px solid var(--brand);outline-offset:-3px;border-radius:24px}.card-title{flex:1;min-width:0}.card-title h2{font-size:1.15rem;margin:0}.desc,.empty,.meta,.chart-period,.chart-empty{color:var(--muted)}.desc{margin:.1rem 0}.chevron{width:.5rem;height:.5rem;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}details[open]>.card-head .chevron{transform:rotate(45deg)}.card-body{padding:0 1.1rem 1.1rem}.addr-row{display:flex;align-items:center;gap:.3rem}.addr{overflow-x:auto;max-width:calc(100% - 2.3rem);background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:.45rem .6rem;font:600 .88rem ui-monospace,SFMono-Regular,Consolas,monospace}.copy{width:2rem;height:2rem;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--muted);cursor:pointer}.copy:hover,.copy:focus-visible{background:var(--panel2);color:var(--text)}.copy.copied{color:var(--accent);border-color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem;margin:1rem 0}.stat,.chart{border:1px solid var(--border);border-radius:14px;padding:.65rem;background:color-mix(in srgb,var(--panel2) 65%,transparent)}.value{display:block;font-weight:800}.chart-head{display:flex;justify-content:space-between}.chart{margin:1rem 0}.chart-title{font-weight:800}.latency-chart{display:block;width:100%;height:6rem}.chart-grid{stroke:var(--border)}.latency-line{fill:none;stroke:var(--accent);stroke-width:1.5}.meta{border-top:1px solid var(--border);padding-top:.8rem;font-size:.85rem}.reconnect-banner{position:sticky;top:0;z-index:100;display:flex;gap:.75rem;justify-content:center;align-items:center;padding:.7rem 1rem;background:#fee2e2;color:#7f1d1d;border-bottom:1px solid #fca5a5;font-weight:700;box-shadow:var(--shadow)}.reconnect-banner button{border:1px solid #fca5a5;border-radius:10px;background:#fff1f2;color:#9f1239;padding:.4rem .75rem;font-weight:700;cursor:pointer}@media(max-width:34rem){main{width:calc(100% - 1rem);padding:1rem 0}.stats{grid-template-columns:1fr}}
</style>
<main><section class="hero" aria-labelledby="title"><p class="eyebrow">server operator console</p><div class="brand-lockup"><svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="logo-cyan" x1="9" y1="37" x2="39" y2="10" gradientUnits="userSpaceOnUse"><stop stop-color="#0755ed"/><stop offset="1" stop-color="#18dcff"/></linearGradient><linearGradient id="logo-indigo" x1="10" y1="11" x2="39" y2="39" gradientUnits="userSpaceOnUse"><stop stop-color="#1650e7"/><stop offset=".5" stop-color="#8f72ff"/><stop offset="1" stop-color="#2638bf"/></linearGradient></defs><path d="M13 36V16c0-3 3.6-4.5 5.7-2.4l12.5 12.5a3 3 0 0 0 4.2 0l4.8-4.8" fill="none" stroke="url(#logo-cyan)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="m8.7 34.6 10.7-10.7a3.2 3.2 0 0 1 4.5 0l12.5 12.5c1.9 1.9 5.1.6 5.1-2.2V25" fill="none" stroke="url(#logo-indigo)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40" cy="20" r="2.7" fill="#16d9ff"/></svg><h1 id="title"><span class="brand-nt">nt</span>wire server</h1></div><div class="status-row"><span id="state" class="badge">Loading…</span><span id="pac-endpoints" class="badge" hidden>Proxy PAC</span></div></section><nav class="tabs" aria-label="Operator dashboard views"><span class="tab" aria-current="page">Tunnels</span></nav><div id="app" class="empty" aria-live="polite">Loading connected tunnels…</div></main>
<script>
const app=document.querySelector('#app'),state=document.querySelector('#state'),pacEndpoints=document.querySelector('#pac-endpoints'),token=new URLSearchParams(location.search).get('token'),history=new Map(),limit=60,expandedKey='ntwire.server.targetsExpanded';let expanded=new Set;try{expanded=new Set(JSON.parse(localStorage.getItem(expandedKey)||'[]'))}catch{}const saveExpanded=()=>{try{localStorage.setItem(expandedKey,JSON.stringify([...expanded]))}catch{}},bytes=n=>{let u=['B','KiB','MiB','GiB','TiB'],i=0;n=Number(n)||0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]};function stat(l,v){let d=document.createElement('div'),a=document.createElement('span'),b=document.createElement('span');d.className='stat';a.className='label';b.className='value';a.textContent=l;b.textContent=v;d.append(a,b);return d}function chart(t){let k=t.tunnel_ip+'\0'+t.name,h=history.get(k)||[];h.push(t.latency_millis||0);if(h.length>limit)h.shift();history.set(k,h);let c=document.createElement('section'),head=document.createElement('div'),title=document.createElement('span'),period=document.createElement('span');c.className='chart';head.className='chart-head';title.className='chart-title';title.textContent='Client latency';period.className='chart-period';period.textContent=`${t.reconnections||0} reconnection${t.reconnections===1?'':'s'}`;head.append(title,period);c.append(head);if(h.length<2){let e=document.createElement('p');e.className='chart-empty';e.textContent='Collecting latency samples…';c.append(e);return c}let max=Math.max(1,...h),svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),grid=document.createElementNS(svg.namespaceURI,'path'),line=document.createElementNS(svg.namespaceURI,'polyline');svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');svg.classList.add('latency-chart');grid.setAttribute('d','M0 0H100M0 50H100M0 100H100');grid.classList.add('chart-grid');line.setAttribute('points',h.map((v,i)=>`${i/(h.length-1)*100},${100-v/max*100}`).join(' '));line.classList.add('latency-line');svg.append(grid,line);c.append(svg);return c}function copy(v){let b=document.createElement('button');b.type='button';b.className='copy';b.textContent='⧉';b.title='Copy address';b.setAttribute('aria-label','Copy address');b.onclick=async()=>{let ok=true;try{await navigator.clipboard.writeText(v)}catch{ok=false}b.classList.toggle('copied',ok);b.title=ok?'Copied':'Copy failed';setTimeout(()=>{b.classList.remove('copied');b.title='Copy address'},1500)};return b}function item(t){let k=t.tunnel_ip+'\0'+t.name,card=document.createElement('details'),head=document.createElement('summary'),title=document.createElement('div'),h=document.createElement('h2'),d=document.createElement('p'),body=document.createElement('div'),addrText=`${t.tunnel_ip.includes(':')?'['+t.tunnel_ip+']':t.tunnel_ip}:${t.virtual_port} → ${t.target}`;card.className='card';card.open=expanded.has(k);card.ontoggle=()=>{card.open?expanded.add(k):expanded.delete(k);saveExpanded()};head.className='card-head';title.className='card-title';h.textContent=t.name;d.className='desc';d.textContent=t.description||'Tunnel endpoint';title.append(h,d);let chevron=document.createElement('span');chevron.className='chevron';head.append(title,chevron);body.className='card-body';let row=document.createElement('div'),addr=document.createElement('code');row.className='addr-row';addr.className='addr';addr.textContent=addrText;row.append(addr,copy(addrText));let stats=document.createElement('div'),meta=document.createElement('div');stats.className='stats';stats.append(stat('To target',bytes(t.stats.bytes_to_target)),stat('From target',bytes(t.stats.bytes_from_target)),stat('Connections',t.stats.connections),stat('Active',t.stats.active_connections),stat('Latency',`${t.latency_millis||0} ms`),stat('Reconnections',t.reconnections||0));meta.className='meta';meta.textContent=`${t.method} · ${t.identity} · expires ${new Date(t.expires).toLocaleString()}`;body.append(row,stats,chart(t),meta);card.append(head,body);return card}let retryTimer,reconnectBanner,nextRetryAt;function banner(){if(!reconnectBanner){reconnectBanner=document.createElement('div');reconnectBanner.className='reconnect-banner';reconnectBanner.setAttribute('role','alert');reconnectBanner.innerHTML='Lost contact with the ntwire server. <span></span><button type="button">Close tab</button>';reconnectBanner.querySelector('button').onclick=()=>window.close();document.body.prepend(reconnectBanner)}reconnectBanner.querySelector('span').textContent=`Retrying in ${Math.max(0,Math.ceil((nextRetryAt-Date.now())/1000))}s.`}function schedule(){clearTimeout(retryTimer);nextRetryAt=Date.now()+5000;retryTimer=setTimeout(refresh,5000)}async function refresh(){try{let r=await fetch('/v1/dashboard?token='+encodeURIComponent(token));if(!r.ok)throw Error();let s=await r.json();reconnectBanner?.remove();reconnectBanner=null;state.textContent=`${s.sessions} active session${s.sessions===1?'':'s'} · refreshed ${new Date().toLocaleTimeString()}`;pacEndpoints.hidden=!(s.pac_urls&&s.pac_urls.length);pacEndpoints.title=(s.pac_urls||[]).join(' · ');app.replaceChildren();if(!s.tunnels.length){app.className='empty';app.textContent='No tunnels are currently granted to active sessions.';return}app.className='';let list=document.createElement('ul');list.className='grid';s.tunnels.forEach(t=>list.append(item(t)));app.append(list)}catch{state.textContent='Dashboard unavailable';app.className='empty';app.textContent='The dashboard is unavailable or the access token is invalid.';nextRetryAt=Date.now()+5000;banner()}finally{schedule()}}refresh();
</script>
