<main>

    <p class="eyebrow">local tunnel console</p>
    <h1 id="title">ntwire</h1>
    <p id="server" class="server-addr"></p>
    <p class="lede">Monitor connection health, traffic totals, and local tunnel ports from this private browser view.</p>
    <div class="status-row"><span id="state" class="badge">Loading…</span><span id="transport" class="badge">Loading transport…</span></div>
    <p id="message" role="status"></p>
  </section>
  <div id="tabs" class="tabs" role="tablist" aria-label="Dashboard views">
    <button id="tab-tunnels" type="button" class="tab-btn active" role="tab" aria-controls="app" aria-selected="true">Tunnels</button>
    <button id="tab-portal" type="button" class="tab-btn" role="tab" aria-controls="portal-app" aria-selected="false">🌐 Portal</button>

// charts show up to five minutes of history immediately even if this tab
// was just opened and no browser was polling while the connection ran. A

// these track which ones the user has explicitly expanded rather than folded.

// A failed read keeps the previous copy instead of blanking the cards.
let instructions=new Map();

const copyPaths=['M9.5 8.5h9v9h-9z','M5.5 15.5v-9h9'],checkPaths=['M5 12.5l4.5 4.5L19 7.5'],linkPaths=['M14 5h5v5','M19 5l-8 8','M17 14v5H5V7h5'];
function icon(paths){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('aria-hidden','true');paths.forEach(d=>{const p=document.createElementNS(s.namespaceURI,'path');p.setAttribute('d',d);s.append(p)});return s}

function spans(list){return (list||[]).map(s=>{if(s.type==='code'){const c=document.createElement('code');c.className='inline';c.textContent=s.text;return c}

function bytes(n){const u=['B','KiB','MiB','GiB','TiB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]}

// trafficSeries derives per-tunnel traffic-rate samples for tunnelName from
// the full history array (each entry's cumulative byte counters, the same

const downColor='#dc2626';
// transportLegend lists each transport type seen, plus -- when any sample

// "down" in as if it were just another transport type.

function healthChart(samples,reconnections){const chart=document.createElement('section'),head=document.createElement('div'),title=document.createElement('span'),metrics=document.createElement('div'),current=samples.at(-1)?.latency||0;chart.className='chart';head.className='chart-head';title.className='chart-title';title.textContent='📶 Server latency';metrics.className='chart-period';metrics.textContent=`${current} ms · ${reconnections} reconnection${reconnections===1?'':'s'}`;head.append(title,metrics);chart.append(head,transportLegend(samples));if(samples.length<2){const empty=document.createElement('p');empty.className='chart-empty';empty.textContent='Collecting latency samples…';chart.append(empty);return chart}const max=chartMax(Math.max(...samples.map(s=>s.latency))),points=samples.map((s,i)=>`${(i/(samples.length-1)*100).toFixed(2)},${(100-s.latency/max*100).toFixed(2)}`).join(' '),svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),grid=document.createElementNS(svg.namespaceURI,'path'),line=document.createElementNS(svg.namespaceURI,'polyline'),transportBand=document.createElementNS(svg.namespaceURI,'g'),plot=document.createElement('div'),scale=document.createElement('div');plot.className='chart-plot';scale.className='chart-scale';for(const v of [max,max/2,0]){const l=document.createElement('span');l.textContent=`${Math.round(v)} ms`;scale.append(l)}svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('role','img');svg.setAttribute('aria-label','Server latency with connection transport and downtime history');svg.classList.add('traffic-chart');grid.setAttribute('d','M0 0H100M0 50H100M0 100H100');grid.classList.add('traffic-grid');line.setAttribute('points',points);line.classList.add('traffic-incoming');for(let i=0;i<samples.length-1;i++){const segment=document.createElementNS(svg.namespaceURI,'line');segment.setAttribute('x1',(i/(samples.length-1)*100).toFixed(2));segment.setAttribute('x2',((i+1 addEventListener('hashchange',selectHash);
function setSettingsURL(url){const next=url||'',changed=!settingsURLKnown||settingsURL!==next;settingsURLKnown=true;settingsURL=next;tabSettings.hidden=!settingsURL;if(!settingsURL&&activeTab==='settings')switchTab('tunnels');else if(changed)selectHash();}
function renderSettingsView(){if(!settingsURL){switchTab('tunnels');return}const frame=document.createElement('iframe');frame.className='settings-frame';frame.title='Local connection settings';frame.src=settingsURL;settingsApp.replaceChildren(frame)}
async function renderPortalView(){portalApp.replaceChildren();const loading=document.createElement('div');loading.className='empty';loading.textContent='Loading portal…';portalApp.append(loading);try{const q='?token='+encodeURIComponent(token),r=await fetch('/portal'+q);if(!r.ok)throw Error(await r.text());const data=await r.json();portalApp.replaceChildren();const card=document.createElement('div');card.className='portal-card';card.innerHTML=data.html||'<p>No portal content available.</p>';card.querySelectorAll('.ntwire-action-btn').forEach(btn=>{btn.addEventListener('click',async()=>{const action=btn.getAttribute('data-action')||'open',targetId=btn.getAttribute('data-target');message.textContent='Executing action on '+targetId+'…';btn.disabled=true;try{const ar=await fetch('/portal/action'+q,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:action,target_id:targetId})});if(!ar.ok)throw Error(await ar.text());message.textContent='Action executed.'}catch(err){message.textContent='Action error: '+err.message}finally{btn.disabled=false}})});card.querySelectorAll('.copy-button').forEach(btn=>{btn.addEventListener('click',()=>{const text=btn.getAttribute('data-copy');if(text){navigator.clipboard.writeText(text).then(()=>{const prev=btn.textContent;btn.textContent='Copied!';setTimeout(()=>{btn.textContent=prev},1500)})}})});portalApp.append(card)}catch(err){switchTab('tunnels');message.textContent='Portal is not configured or unavailable for this session.'}}
selectHash();
const retryDelay=5000;let retryTimer=null,retryTicker=null,nextRetryAt=0,reconnectBanner=null;
function updateReconnectBanner(){if(!reconnectBanner)return;const seconds=Math.max(0,Math.ceil((nextRetryAt-Date.now())/1000));reconnectBanner.querySelector('[data-retry-countdown]').textContent=`Retrying in ${seconds}s.`}
function showReconnectBanner(){if(!reconnectBanner){const text=document.createElement('span'),btn=document.createElement('button');reconnectBanner=document.createElement('div');reconnectBanner.className='reconnect-banner';reconnectBanner.setAttribute('role','alert');text.textContent='⚠️ Lost contact with the ntwire client. ';const countdown=document.createElement('span');countdown.dataset.retryCountdown='';text.append(countdown);btn.type='button';btn.textContent='Close tab';btn.addEventListener('click',()=>window.close());reconnectBanner.append(text,btn);document.body.prepend(reconnectBanner);retryTicker=setInterval(updateReconnectBanner,250)}updateReconnectBanner()}
function hideReconnectBanner(){if(!reconnectBanner)return;reconnectBanner.remove();reconnectBanner=null;clearInterval(retryTicker);retryTicker=null}
function scheduleRefresh(){clearTimeout(retryTimer);nextRetryAt=Date.now()+retryDelay;updateReconnectBanner();retryTimer=setTimeout(refresh,retryDelay)}
function multipathSection(s){if(!s.paths||!s.paths.length)return null;const card=document.createElement('section');card.className='transport-card';const h2=document.createElement('h2');h2.textContent='⚡ Transports & Performance';const desc=document.createElement('p');desc.className='desc';desc.textContent='Live multi-transport candidate paths, speed evaluation, and manual forcing:';const table=document.createElement('table');table.className='transport-table';const thead=document.createElement('thead');thead.innerHTML='<tr><th>Path</th><th>Kind</th><th>Status</th><th>RTT</th><th>Loss</th><th>Delivery</th></tr>';table.append(thead);const tbody=document.createElement('tbody');s.paths.forEach(p=>{const tr=document.createElement('tr');let statusText=p.healthy?'Healthy':'Unhealthy';if(p.primary){statusText+=p.forced?' (Primary, Forced)':' (Primary)';}else if(p.forced){statusText+=' (Forced, Fallback Active)';}const delivery=p.delivery_ratio>=0?Math.round(p.delivery_ratio*100)+'%':'-';const rtt=Math.round((p.rtt||0)/1000000)+' ms';const loss=(p.loss*100).toFixed(1)+'%';tr.innerHTML=`<td><strong>${p.name}</strong></td><td>${p.kind}</td><td><span class="path-badge ${p.primary?'primary':''} ${p.forced?'forced':''}">${statusText}</span></td><td>${rtt}</td><td>${loss}</td><td>${delivery}</td>`;tbody.append(tr)});table.append(tbody);const btnGroup=document.createElement('div');btnGroup.className='transport-btn-group';const btnLabel=document.createElement('span');btnLabel.className='btn-label';btnLabel.textContent='Forced Mode:';btnGroup.append(btnLabel);const modes=[{id:'auto',label:'Automatic (Fastest)'},{id:'direct-udp',label:'Direct UDP'},{id:'udp-relay',label:'UDP Relay'},{id:'wss',label:'WebSocket'}];const currentForced=s.forced||'';modes.forEach(m=>{const b=document.createElement('button');b.type='button';b.className='transport-btn';const isActive=(m.id==='auto'&&!currentForced)||(m.id===currentForced);b.classList.toggle('active',isActive);b.textContent=m.label;b.addEventListener('click',async()=>{b.disabled=true;message.textContent=`Switching transport to ${m.label}…`;try{const target=m.id==='auto'?'':m.id;const q='?token='+encodeURIComponent(token);const r=await fetch('/transport'+q,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({transport:target})});if(!r.ok)throw Error(await r.text());message.textContent=m.id==='auto'?'Switched to automatic transport selection.':`Forced transport to ${m.id}.`;await refresh()}catch(err){message.textContent='Could not switch transport: '+err.message}finally{b.disabled=false}});btnGroup.append(b)});card.append(h2,desc,table,btnGroup);return card}
async function refresh(){clearTimeout(retryTimer);try{const q='?token='+encodeURIComponent(token),[r,ri,rh]=await Promise.all([fetch('/status'+q),fetch('/instructions'+q).catch(()=>null),fetch('/history'+q).catch(()=>null)]);if(!r.ok)throw Error();await readInstructions(ri);await readHistory(rh);const s=await r.json();hideReconnectBanner();setSettingsURL(s.settings_url);const healthSamples=statusHistory.samples.map(hs=>({latency:hs.latency_millis||0,time:Date.parse(hs.time),connectionType:hs.connection_type||'unknown',connected:hs.connected}));const health=document.querySelector('#health');health.replaceChildren(generalStatsSection(s.tunnels,healthSamples,s.reconnections||0));const transportSection=document.querySelector('#transport-section');const mpNode=multipathSection(s);if(mpNode){transportSection.replaceChildren(mpNode)}else{transportSection.replaceChildren()}state.textContent=s.connected?'Connected':'Disconnected';state.classList.toggle('connected',!!s.connected);let connTypeText=s.connection_type||'Transport unavailable';if(s.forced){connTypeText+=s.forced_effective?` [forced: ${s.forced}]`:` [forced: ${s.forced}, fallback active]`;}transport.textContent=connTypeText;title.textContent=s.server_name||'ntwire';document.querySelector('#server').textContent=s.server;document.title=s.server_name?`ntwire · ${s.server_name}`:'ntwire status';tunnelList.replaceChildren();if(!s.tunnels.length){tunnelList.className='empty';tunnelList.textContent='No tunnels are available for this session.';return}tunnelList.className='';const list=document.createElement('ul');list.className='grid';s.tunnels.forEach(t=>list.append(item(t,trafficSeries(statusHistory.samples,t.name))));tunnelList.append(list)}catch{state.textContent='Unavailable';state.classList.remove('connected');transport.textContent='Transport unavailable';tunnelList.className='empty';tunnelList.textContent='Connection status is unavailable.';showReconnectBanner()}finally{scheduleRefresh()}}
refresh();
</script>
