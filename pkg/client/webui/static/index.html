<main>
  <section class="hero" aria-labelledby="title">
    <p class="eyebrow">local tunnel console</p>
    <h1 id="title">ntwire</h1>
    <p id="server" class="server-addr"></p>
    <p class="lede">Monitor connection health, traffic totals, and local tunnel ports from this private browser view.</p>
    <div class="status-row"><span id="state" class="badge">Loading…</span><span id="transport" class="badge">Loading transport…</span></div>
    <div id="health"></div><p id="message" role="status"></p>
  </section>
  <div id="app" class="empty">Loading connection status…</div>
</main>
<script>
const app=document.getElementById('app'),message=document.getElementById('message'),state=document.getElementById('state'),transport=document.getElementById('transport'),title=document.getElementById('title'),token=new URLSearchParams(location.search).get('token');
const trafficHistory=new Map(),healthHistory=[],historyLimit=60;
// refresh() rebuilds every card from scratch, so which sections are collapsed
// has to live outside the DOM. Collapsed rather than open, so tunnels stay
// expanded until the user folds them away.
const collapsedKey='ntwire.collapsed';
let collapsed=new Set();try{collapsed=new Set(JSON.parse(localStorage.getItem(collapsedKey)||'[]'))}catch{}
function setCollapsed(name,v){v?collapsed.add(name):collapsed.delete(name);try{localStorage.setItem(collapsedKey,JSON.stringify([...collapsed]))}catch{}}
// Stats default collapsed (the opposite of the card default above), so this
// tracks which tunnels the user has explicitly expanded rather than folded.
const statsExpandedKey='ntwire.statsExpanded';
let statsExpanded=new Set();try{statsExpanded=new Set(JSON.parse(localStorage.getItem(statsExpandedKey)||'[]'))}catch{}
function setStatsExpanded(name,v){v?statsExpanded.add(name):statsExpanded.delete(name);try{localStorage.setItem(statsExpandedKey,JSON.stringify([...statsExpanded]))}catch{}}
// Instructions come from their own endpoint rather than /status, which the CLI
// also decodes, and are re-read on every poll: the rendered commands quote the
// port bound right now, and a server config reload can change the text itself.
// A failed read keeps the previous copy instead of blanking the cards.
let instructions=new Map();
async function readInstructions(r){if(!r||!r.ok)return;try{const d=await r.json();instructions=new Map((d.tunnels||[]).map(t=>[t.name,t]))}catch{}}
const copyPaths=['M9.5 8.5h9v9h-9z','M5.5 15.5v-9h9'],checkPaths=['M5 12.5l4.5 4.5L19 7.5'],linkPaths=['M14 5h5v5','M19 5l-8 8','M17 14v5H5V7h5'];
function icon(paths){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('aria-hidden','true');paths.forEach(d=>{const p=document.createElementNS(s.namespaceURI,'path');p.setAttribute('d',d);s.append(p)});return s}
function fallbackCopy(text){const a=document.createElement('textarea');a.value=text;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch{}a.remove();return ok}
function copyButton(text,label){const b=document.createElement('button');b.type='button';b.className='copy';const reset=()=>{b.classList.remove('copied');b.replaceChildren(icon(copyPaths));b.title=label;b.setAttribute('aria-label',label)};reset();
// Inside a <summary> a click would toggle the section, so swallow the event.
b.addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();let ok=true;try{await navigator.clipboard.writeText(text)}catch{ok=fallbackCopy(text)}const said=ok?'Copied':'Copy failed';b.classList.toggle('copied',ok);b.replaceChildren(icon(ok?checkPaths:copyPaths));b.title=said;b.setAttribute('aria-label',said);setTimeout(reset,1500)});return b}
function spans(list){return (list||[]).map(s=>{if(s.type==='code'){const c=document.createElement('code');c.className='inline';c.textContent=s.text;return c}
if(s.type==='strong'||s.type==='em'){const e=document.createElement(s.type);e.textContent=s.text;return e}
if(s.type==='link'&&/^https?:\/\//i.test(s.href||'')){const a=document.createElement('a');a.href=s.href;a.textContent=s.text;a.target='_blank';a.rel='noopener noreferrer';return a}
return document.createTextNode(s.text||'')})}
// Instruction content is server-supplied, so it is only ever built as DOM
// nodes from the parsed block tree -- never assigned as markup.
function blocks(list){const f=document.createDocumentFragment();(list||[]).forEach(b=>{
if(b.type==='code'){const w=document.createElement('div'),pre=document.createElement('pre'),c=document.createElement('code');w.className='code';c.textContent=b.text||'';pre.append(c);w.append(pre,copyButton(b.text||'','Copy command'));f.append(w);return}
if(b.type==='list'){const l=document.createElement(b.ordered?'ol':'ul');l.className='md-list';(b.items||[]).forEach(it=>{const li=document.createElement('li');li.append(...spans(it));l.append(li)});f.append(l);return}
// Instruction headings start at h4: h2 is the tunnel name and h3 the section
// label, so the card keeps a sane outline whatever depth the Markdown uses.
