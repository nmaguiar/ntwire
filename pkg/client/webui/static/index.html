<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ntwire status</title>
<style>
:root{color-scheme:light dark;--bg:#f7f9fc;--panel:#fff;--panel-2:#eef4ff;--text:#162033;--muted:#607089;--brand:#246bfe;--brand-strong:#174fc5;--accent:#10a37f;--danger:#c2410c;--border:#d9e2f1;--shadow:0 20px 60px rgba(22,32,51,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--panel:#111a2e;--panel-2:#15223a;--text:#edf4ff;--muted:#9fb0ca;--brand:#79a7ff;--brand-strong:#a9c5ff;--accent:#4ade80;--danger:#fb923c;--border:#263753;--shadow:0 20px 60px rgba(0,0,0,.35)}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:radial-gradient(circle at top left,color-mix(in srgb,var(--brand) 18%,transparent),transparent 34rem),var(--bg)}
main{width:min(72rem,calc(100% - 2rem));margin:0 auto;padding:3rem 0}.hero,.card{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow)}.hero{padding:2rem;margin-bottom:1.25rem;display:grid;gap:1rem}.eyebrow{margin:0;color:var(--muted);font-size:.78rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}h1{font-size:clamp(2.2rem,7vw,4.8rem);line-height:.95;margin:.15rem 0}.lede{margin:0;color:var(--muted);max-width:42rem}.status-row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}.badge{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--border);border-radius:999px;padding:.38rem .7rem;background:var(--panel-2);font-weight:700}.badge::before{content:"";width:.65rem;height:.65rem;border-radius:50%;background:var(--danger)}.badge.connected::before{background:var(--accent);box-shadow:0 0 0 .25rem color-mix(in srgb,var(--accent) 18%,transparent)}#message{min-height:1.5em;margin:.25rem 0 0;color:var(--danger);font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr));gap:1rem;margin:0;padding:0;list-style:none}.card{padding:1.1rem}.card h2{font-size:1.15rem;margin:0}.desc{color:var(--muted);margin:.15rem 0 .85rem}.addr{display:inline-block;background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:.45rem .6rem;font:600 .95rem ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--text)}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem;margin:1rem 0}.stat{border:1px solid var(--border);border-radius:14px;padding:.65rem;background:color-mix(in srgb,var(--panel-2) 65%,transparent)}.label{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}.value{font-weight:800}.chart{margin:1rem 0;border:1px solid var(--border);border-radius:14px;padding:.65rem;background:color-mix(in srgb,var(--panel-2) 65%,transparent)}.chart-head{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline}.chart-title{font-weight:800}.chart-period{color:var(--muted);font-size:.75rem}.legend{display:flex;gap:.75rem;flex-wrap:wrap;margin:.45rem 0;color:var(--muted);font-size:.76rem}.legend span{display:inline-flex;align-items:center;gap:.3rem}.legend i{width:.65rem;height:.18rem;border-radius:99px;background:var(--brand)}.legend .incoming{background:var(--accent)}.chart-plot{display:grid;grid-template-columns:3.75rem minmax(0,1fr);gap:.45rem;align-items:stretch}.chart-scale{display:flex;flex-direction:column;justify-content:space-between;color:var(--muted);font-size:.7rem;line-height:1;text-align:right;padding:.2rem 0}.traffic-chart{display:block;width:100%;height:7rem;overflow:visible}.traffic-grid{stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke}.traffic-area{stroke:none}.traffic-outgoing-area{fill:color-mix(in srgb,var(--brand) 14%,transparent)}.traffic-incoming-area{fill:color-mix(in srgb,var(--accent) 14%,transparent)}.traffic-outgoing,.traffic-incoming{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.traffic-outgoing{stroke:var(--brand)}.traffic-incoming{stroke:var(--accent)}.chart-empty{color:var(--muted);font-size:.82rem;margin:.65rem 0 .25rem}form{display:flex;gap:.5rem;align-items:end;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:.9rem}label{display:grid;gap:.25rem;color:var(--muted);font-size:.85rem}input{width:7rem;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);padding:.55rem .6rem;font:inherit}button{border:0;border-radius:10px;background:var(--brand);color:var(--bg);padding:.6rem .8rem;font-weight:800;cursor:pointer}button:hover,button:focus-visible{background:var(--brand-strong)}button:disabled{cursor:wait;opacity:.65}.empty{color:var(--muted)}
</style>
<main>
  <section class="hero" aria-labelledby="title">
    <p class="eyebrow">local tunnel console</p>
    <h1 id="title">ntwire</h1>
    <p class="lede">Monitor connection health, traffic totals, and local tunnel ports from this private browser view.</p>
    <div class="status-row"><span id="state" class="badge">Loading…</span></div>
    <div id="health"></div><p id="message" role="status"></p>
  </section>
  <div id="app" class="empty">Loading connection status…</div>
</main>
<script>
const app=document.getElementById('app'),message=document.getElementById('message'),state=document.getElementById('state'),token=new URLSearchParams(location.search).get('token');
const trafficHistory=new Map(),healthHistory=[],historyLimit=60;
function bytes(n){const u=['B','KiB','MiB','GiB','TiB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]}
function stat(label,value){const d=document.createElement('div'),l=document.createElement('span'),v=document.createElement('span');d.className='stat';l.className='label';v.className='value';l.textContent=label;v.textContent=value;d.append(l,v);return d}
function rate(n){return bytes(n)+'/s'}
function recordTraffic(t){const now=Date.now();let samples=trafficHistory.get(t.name)||[],last=samples.at(-1);if(last&&(t.stats.bytes_from_tunnel<last.incomingBytes||t.stats.bytes_to_tunnel<last.outgoingBytes)){samples=[];last=undefined}const elapsed=last?(now-last.time)/1000:0,incoming=last&&elapsed>0?(t.stats.bytes_from_tunnel-last.incomingBytes)/elapsed:0,outgoing=last&&elapsed>0?(t.stats.bytes_to_tunnel-last.outgoingBytes)/elapsed:0;samples.push({time:now,incoming,outgoing,incomingBytes:t.stats.bytes_from_tunnel,outgoingBytes:t.stats.bytes_to_tunnel});if(samples.length>historyLimit)samples.shift();trafficHistory.set(t.name,samples);return samples}
function chartMax(value){const exponent=10**Math.floor(Math.log10(Math.max(1,value))),fraction=value/exponent,step=fraction<=1?1:fraction<=2?2:fraction<=5?5:10;return step*exponent}
function trafficChart(samples){const chart=document.createElement('section'),head=document.createElement('div'),title=document.createElement('span'),period=document.createElement('span'),legend=document.createElement('div');chart.className='chart';head.className='chart-head';title.className='chart-title';title.textContent='Traffic rate';period.className='chart-period';period.textContent=samples.length>1?`last ${Math.round((samples.at(-1).time-samples[0].time)/1000)} seconds`:'last 5 minutes';head.append(title,period);legend.className='legend';legend.innerHTML='<span><i class="incoming"></i>Incoming</span><span><i></i>Outgoing</span>';chart.append(head,legend);if(samples.length<2){const empty=document.createElement('p');empty.className='chart-empty';empty.textContent='Collecting traffic samples…';chart.append(empty);return chart}const max=chartMax(Math.max(...samples.flatMap(s=>[s.incoming,s.outgoing]))),point=(key,i)=>`${(i/(samples.length-1)*100).toFixed(2)},${(100-samples[i][key]/max*100).toFixed(2)}`,points=key=>samples.map((_,i)=>point(key,i)).join(' '),area=key=>`M0 100 L${points(key)} L100 100 Z`,plot=document.createElement('div'),scale=document.createElement('div'),svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),incomingArea=document.createElementNS(svg.namespaceURI,'path'),outgoingArea=document.createElementNS(svg.namespaceURI,'path'),grid=document.createElementNS(svg.namespaceURI,'path'),incoming=document.createElementNS(svg.namespaceURI,'polyline'),outgoing=document.createElementNS(svg.namespaceURI,'polyline');plot.className='chart-plot';scale.className='chart-scale';for(const value of [max,max/2,0]){const label=document.createElement('span');label.textContent=rate(value);scale.append(label)}svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('role','img');svg.setAttribute('aria-label',`Incoming and outgoing traffic rates; scale zero to ${rate(max)}`);svg.classList.add('traffic-chart');incomingArea.setAttribute('d',area('incoming'));incomingArea.classList.add('traffic-area','traffic-incoming-area');outgoingArea.setAttribute('d',area('outgoing'));outgoingArea.classList.add('traffic-area','traffic-outgoing-area');grid.setAttribute('d','M0 0H100M0 50H100M0 100H100');grid.classList.add('traffic-grid');incoming.setAttribute('points',points('incoming'));incoming.classList.add('traffic-incoming');outgoing.setAttribute('points',points('outgoing'));outgoing.classList.add('traffic-outgoing');svg.append(incomingArea,outgoingArea,grid,incoming,outgoing);plot.append(scale,svg);chart.append(plot);return chart}
function healthChart(samples,reconnections){const chart=document.createElement('section'),head=document.createElement('div'),title=document.createElement('span'),metrics=document.createElement('div'),current=samples.at(-1)?.latency||0;chart.className='chart';head.className='chart-head';title.className='chart-title';title.textContent='Control-plane latency';metrics.className='chart-period';metrics.textContent=`${current} ms · ${reconnections} reconnection${reconnections===1?'':'s'}`;head.append(title,metrics);chart.append(head);if(samples.length<2){const empty=document.createElement('p');empty.className='chart-empty';empty.textContent='Collecting latency samples…';chart.append(empty);return chart}const max=chartMax(Math.max(...samples.map(s=>s.latency))),points=samples.map((s,i)=>`${(i/(samples.length-1)*100).toFixed(2)},${(100-s.latency/max*100).toFixed(2)}`).join(' '),svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),grid=document.createElementNS(svg.namespaceURI,'path'),line=document.createElementNS(svg.namespaceURI,'polyline'),plot=document.createElement('div'),scale=document.createElement('div');plot.className='chart-plot';scale.className='chart-scale';for(const v of [max,max/2,0]){const l=document.createElement('span');l.textContent=`${Math.round(v)} ms`;scale.append(l)}svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');svg.classList.add('traffic-chart');grid.setAttribute('d','M0 0H100M0 50H100M0 100H100');grid.classList.add('traffic-grid');line.setAttribute('points',points);line.classList.add('traffic-incoming');svg.append(grid,line);plot.append(scale,svg);chart.append(plot);return chart}
function item(t,samples){const li=document.createElement('li'),h=document.createElement('h2'),desc=document.createElement('p'),addr=document.createElement('code'),stats=document.createElement('div'),form=document.createElement('form'),label=document.createElement('label'),input=document.createElement('input'),button=document.createElement('button');li.className='card';h.textContent=t.name;desc.className='desc';desc.textContent=t.description||'Tunnel endpoint';addr.className='addr';addr.textContent=t.local_address;stats.className='stats';stats.append(stat('Outgoing total',bytes(t.stats.bytes_to_tunnel)),stat('Incoming total',bytes(t.stats.bytes_from_tunnel)),stat('Connections',t.stats.connections),stat('Active',t.stats.active_connections));input.type='number';input.min='1';input.max='65535';input.value=t.local_address.split(':').pop();label.append('Local port',input);button.textContent='Replace port';form.append(label,button);form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='';button.disabled=true;try{const r=await fetch('/tunnels/'+encodeURIComponent(t.name)+'?token='+encodeURIComponent(token),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({local_port:Number(input.value)})});if(!r.ok)throw Error(await r.text());message.textContent='Local port replaced.';await refresh()}catch(e){message.textContent='Could not replace port: '+e.message}finally{button.disabled=false}});li.append(h,desc,addr,stats,trafficChart(samples),form);return li}
async function refresh(){try{const r=await fetch('/status?token='+encodeURIComponent(token));if(!r.ok)throw Error();const s=await r.json(),names=new Set(s.tunnels.map(t=>t.name));trafficHistory.forEach((_,name)=>{if(!names.has(name))trafficHistory.delete(name)});healthHistory.push({latency:s.latency_millis||0});if(healthHistory.length>historyLimit)healthHistory.shift();const health=document.querySelector('#health');health.replaceChildren(healthChart(healthHistory,s.reconnections||0));state.textContent=s.connected?'Connected':'Disconnected';state.classList.toggle('connected',!!s.connected);app.replaceChildren();if(!s.tunnels.length){app.className='empty';app.textContent='No tunnels are available for this session.';return}app.className='';const list=document.createElement('ul');list.className='grid';s.tunnels.forEach(t=>list.append(item(t,recordTraffic(t))));app.append(list)}catch{state.textContent='Unavailable';state.classList.remove('connected');app.className='empty';app.textContent='Connection status is unavailable.'}}
refresh();setInterval(refresh,5000);
</script>
