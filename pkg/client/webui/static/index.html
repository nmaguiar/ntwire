<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ntwire status</title>
<style>
:root{color-scheme:light dark;--bg:#f7f9fc;--panel:#fff;--panel-2:#eef4ff;--text:#162033;--muted:#607089;--brand:#246bfe;--brand-strong:#174fc5;--accent:#10a37f;--danger:#c2410c;--border:#d9e2f1;--shadow:0 20px 60px rgba(22,32,51,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--panel:#111a2e;--panel-2:#15223a;--text:#edf4ff;--muted:#9fb0ca;--brand:#79a7ff;--brand-strong:#a9c5ff;--accent:#4ade80;--danger:#fb923c;--border:#263753;--shadow:0 20px 60px rgba(0,0,0,.35)}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:radial-gradient(circle at top left,color-mix(in srgb,var(--brand) 18%,transparent),transparent 34rem),var(--bg)}
main{width:min(72rem,calc(100% - 2rem));margin:0 auto;padding:3rem 0}.hero,.card{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow)}.hero{padding:2rem;margin-bottom:1.25rem;display:grid;gap:1rem}.eyebrow{margin:0;color:var(--muted);font-size:.78rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}h1{font-size:clamp(2.2rem,7vw,4.8rem);line-height:.95;margin:.15rem 0}.lede{margin:0;color:var(--muted);max-width:42rem}.status-row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}.badge{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--border);border-radius:999px;padding:.38rem .7rem;background:var(--panel-2);font-weight:700}.badge::before{content:"";width:.65rem;height:.65rem;border-radius:50%;background:var(--danger)}.badge.connected::before{background:var(--accent);box-shadow:0 0 0 .25rem color-mix(in srgb,var(--accent) 18%,transparent)}#message{min-height:1.5em;margin:.25rem 0 0;color:var(--danger);font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr));gap:1rem;margin:0;padding:0;list-style:none}.card{padding:1.1rem}.card h2{font-size:1.15rem;margin:0}.desc{color:var(--muted);margin:.15rem 0 .85rem}.addr{display:inline-block;background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:.45rem .6rem;font:600 .95rem ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--text)}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem;margin:1rem 0}.stat{border:1px solid var(--border);border-radius:14px;padding:.65rem;background:color-mix(in srgb,var(--panel-2) 65%,transparent)}.label{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}.value{font-weight:800}form{display:flex;gap:.5rem;align-items:end;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:.9rem}label{display:grid;gap:.25rem;color:var(--muted);font-size:.85rem}input{width:7rem;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);padding:.55rem .6rem;font:inherit}button{border:0;border-radius:10px;background:var(--brand);color:var(--bg);padding:.6rem .8rem;font-weight:800;cursor:pointer}button:hover,button:focus-visible{background:var(--brand-strong)}button:disabled{cursor:wait;opacity:.65}.empty{color:var(--muted)}
</style>
<main>
  <section class="hero" aria-labelledby="title">
    <p class="eyebrow">local tunnel console</p>
    <h1 id="title">ntwire</h1>
    <p class="lede">Monitor connection health, traffic totals, and local tunnel ports from this private browser view.</p>
    <div class="status-row"><span id="state" class="badge">Loading…</span></div>
    <p id="message" role="status"></p>
  </section>
  <div id="app" class="empty">Loading connection status…</div>
</main>
<script>
const app=document.getElementById('app'),message=document.getElementById('message'),state=document.getElementById('state'),token=new URLSearchParams(location.search).get('token');
function bytes(n){const u=['B','KiB','MiB','GiB','TiB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]}
function stat(label,value){const d=document.createElement('div'),l=document.createElement('span'),v=document.createElement('span');d.className='stat';l.className='label';v.className='value';l.textContent=label;v.textContent=value;d.append(l,v);return d}
function item(t){const li=document.createElement('li'),h=document.createElement('h2'),desc=document.createElement('p'),addr=document.createElement('code'),stats=document.createElement('div'),form=document.createElement('form'),label=document.createElement('label'),input=document.createElement('input'),button=document.createElement('button');li.className='card';h.textContent=t.name;desc.className='desc';desc.textContent=t.description||'Tunnel endpoint';addr.className='addr';addr.textContent=t.local_address;stats.className='stats';stats.append(stat('To tunnel',bytes(t.stats.bytes_to_tunnel)),stat('From tunnel',bytes(t.stats.bytes_from_tunnel)),stat('Connections',t.stats.connections),stat('Active',t.stats.active_connections));input.type='number';input.min='1';input.max='65535';input.value=t.local_address.split(':').pop();label.append('Local port',input);button.textContent='Replace port';form.append(label,button);form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='';button.disabled=true;try{const r=await fetch('/tunnels/'+encodeURIComponent(t.name)+'?token='+encodeURIComponent(token),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({local_port:Number(input.value)})});if(!r.ok)throw Error(await r.text());message.textContent='Local port replaced.';await refresh()}catch(e){message.textContent='Could not replace port: '+e.message}finally{button.disabled=false}});li.append(h,desc,addr,stats,form);return li}
async function refresh(){try{const r=await fetch('/status?token='+encodeURIComponent(token));if(!r.ok)throw Error();const s=await r.json();state.textContent=s.connected?'Connected':'Disconnected';state.classList.toggle('connected',!!s.connected);app.replaceChildren();if(!s.tunnels.length){app.className='empty';app.textContent='No tunnels are available for this session.';return}app.className='';const list=document.createElement('ul');list.className='grid';s.tunnels.forEach(t=>list.append(item(t)));app.append(list)}catch{state.textContent='Unavailable';state.classList.remove('connected');app.className='empty';app.textContent='Connection status is unavailable.'}}
refresh();setInterval(refresh,5000);
</script>
