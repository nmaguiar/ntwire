services:
  dummy:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:8080", "-text=ntwire-e2e-ok"]
    networks:
      target:
        ipv4_address: 172.30.250.10

  direct-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["-config", "/e2e/direct-server.yaml"]
    volumes:
      - ${E2E_STATE_DIR}:/e2e:ro
    networks:
      target: {}
      direct:
        ipv4_address: ${E2E_DIRECT_SERVER_IP}

  relay:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.relay
    command: ["-config", "/e2e/relay.yaml"]
    environment:
      NTWIRE_LOG_LEVEL: debug
    volumes:
      - ${E2E_STATE_DIR}:/e2e:ro
    networks:
      relay-agent: {}
      relay-public:
        aliases: [home.relay.test]

  relayed-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["-config", "/e2e/relayed-server.yaml"]
    environment:
      NTWIRE_LOG_LEVEL: debug
    volumes:
      - ${E2E_STATE_DIR}:/e2e:ro
    networks: [target, relay-agent]

  direct-client:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.client
    command: ["connect", "--no-browser", "--known-servers", "/e2e/direct-known-servers.yaml", "-i", "/e2e/client-id", "https://direct-server:8443"]
    restart: on-failure
    volumes:
      - ${E2E_STATE_DIR}:/e2e:ro
      - ${E2E_STATE_DIR}/direct-client:/home/nonroot/.ntwire
    depends_on: [direct-server]
    networks: [direct]

  relay-client:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.client
    command: ["connect", "--no-browser", "--known-servers", "/e2e/relay-known-servers.yaml", "-i", "/e2e/client-id", "https://home.relay.test:9443"]
    environment:
      NTWIRE_LOG_LEVEL: debug
    restart: on-failure
    volumes:
      - ${E2E_STATE_DIR}:/e2e:ro
      - ${E2E_STATE_DIR}/relay-client:/home/nonroot/.ntwire
    depends_on: [relay, relayed-server]
    networks: [relay-public]

  verify-direct:
    image: curlimages/curl:8.10.1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        # The client announces its authenticated control connection before
        # the WireGuard data plane has completed its initial handshake. In
        # particular, the relayed WSS path can need several seconds more on
        # a cold CI runner. Keep each individual request tightly bounded,
        # but allow a bounded readiness window for the tunnel itself.
        i=0
        while [ "$$i" -lt 12 ]; do
          (
            test "$$(curl -fsS --max-time 2 http://127.0.0.1:18080)" = ntwire-e2e-ok &
            host_pid=$$!
            test "$$(curl -fsS --max-time 2 http://127.70.0.1:18081)" = ntwire-e2e-ok &
            ip_pid=$$!
            test "$$(curl -fsS --max-time 2 --socks5-hostname 127.0.0.1:11080 http://dummy:8080)" = ntwire-e2e-ok &
            socks_pid=$$!
            status=0
            wait "$$host_pid" || status=1
            wait "$$ip_pid" || status=1
            wait "$$socks_pid" || status=1
            test "$$status" -eq 0
          ) && exit 0
          i=$$((i + 1))
          sleep 1
        done
        exit 1
    depends_on: [direct-client]
    network_mode: service:direct-client

  verify-relay:
    image: curlimages/curl:8.10.1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        # See verify-direct: this is a tunnel-readiness retry window, not a
        # relaxation of the per-request two-second timeout.
        i=0
        while [ "$$i" -lt 12 ]; do
          (
            test "$$(curl -fsS --max-time 2 http://127.0.0.1:18080)" = ntwire-e2e-ok &
            host_pid=$$!
            test "$$(curl -fsS --max-time 2 http://127.70.0.1:18081)" = ntwire-e2e-ok &
            ip_pid=$$!
            test "$$(curl -fsS --max-time 2 --socks5-hostname 127.0.0.1:11080 http://dummy:8080)" = ntwire-e2e-ok &
            socks_pid=$$!
            status=0
            wait "$$host_pid" || status=1
            wait "$$ip_pid" || status=1
            wait "$$socks_pid" || status=1
            test "$$status" -eq 0
          ) && exit 0
          i=$$((i + 1))
          sleep 1
        done
        exit 1
    depends_on: [relay-client]
    network_mode: service:relay-client

networks:
  target:
    ipam:
      config:
        - subnet: 172.30.250.0/24
  direct:
    external: true
    name: ${E2E_DIRECT_NETWORK}
  relay-agent: {}
  relay-public: {}
