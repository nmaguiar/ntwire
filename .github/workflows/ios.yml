name: iOS

# The native iOS client (ios/NTWire) is temporarily archived — see
# docs/IOS.md. Automatic triggers are disabled while it's paused; this
# workflow can still be run manually and is left in place to resume easily.
on: [workflow_dispatch]

jobs:
  swift-core:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/NTWire
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build unsigned iOS simulator app
        run: xcodebuild -project NTWire.xcodeproj -scheme NTWire -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Test Swift control-plane core
        run: swift test --scratch-path "$RUNNER_TEMP/ntwire-swift-build"
