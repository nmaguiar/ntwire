name: Docker Images CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '43 2 * * 6'

# Image publishing authenticates to registries with its own secrets; the
# GitHub token itself needs no more than read access to the repository.
permissions:
  contents: read

jobs:

  build-x64:
    name: Build x64 (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ntwire-server
            dockerfile: deploy/docker/Dockerfile
          - image: ntwire-client
            dockerfile: deploy/docker/Dockerfile.client
          - image: ntwire-relay
            dockerfile: deploy/docker/Dockerfile.relay

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Login to DockerHub
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      name: Build and push
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64
        push: true
        tags: nmaguiar/${{ matrix.image }}:build-x64

  build-arm:
    name: Build arm64 (${{ matrix.image }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ntwire-server
            dockerfile: deploy/docker/Dockerfile
          - image: ntwire-client
            dockerfile: deploy/docker/Dockerfile.client
          - image: ntwire-relay
            dockerfile: deploy/docker/Dockerfile.relay

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Login to DockerHub
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      name: Build and push
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/arm64
        push: true
        tags: nmaguiar/${{ matrix.image }}:build-arm

  build:
    name: Manifest (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [build-arm, build-x64]
    strategy:
      fail-fast: false
      matrix:
        image: [ntwire-server, ntwire-client, ntwire-relay]
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Login to DockerHub
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Create and push multi-arch manifest
      run: |
        docker buildx imagetools create --tag nmaguiar/${{ matrix.image }}:build nmaguiar/${{ matrix.image }}:build-x64 nmaguiar/${{ matrix.image }}:build-arm
