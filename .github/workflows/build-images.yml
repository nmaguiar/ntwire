name: Docker Images CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '43 2 * * 6'

jobs:

  build-x64:
    name: Build x64 (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ntwire-server
            dockerfile: deploy/docker/Dockerfile
          - image: ntwire-client
            dockerfile: deploy/docker/Dockerfile.client
          - image: ntwire-relay
            dockerfile: deploy/docker/Dockerfile.relay

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - uses: docker/build-push-action@v6
      name: Build and push
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64
        push: true
        tags: nmaguiar/${{ matrix.image }}:build-x64

  build-arm:
    name: Build arm64 (${{ matrix.image }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ntwire-server
            dockerfile: deploy/docker/Dockerfile
          - image: ntwire-client
            dockerfile: deploy/docker/Dockerfile.client
          - image: ntwire-relay
            dockerfile: deploy/docker/Dockerfile.relay

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - uses: docker/build-push-action@v6
      name: Build and push
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/arm64
        push: true
        tags: nmaguiar/${{ matrix.image }}:build-arm

  build:
    name: Manifest (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [build-arm, build-x64]
    strategy:
      fail-fast: false
      matrix:
        image: [ntwire-server, ntwire-client, ntwire-relay]
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Create and push multi-arch manifest
      run: |
        docker buildx imagetools create --tag nmaguiar/${{ matrix.image }}:build nmaguiar/${{ matrix.image }}:build-x64 nmaguiar/${{ matrix.image }}:build-arm
