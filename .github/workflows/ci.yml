name: CI

on: [push, pull_request, workflow_dispatch]

# CI only builds and tests; it never needs to write to the repository. Without
# this block the job inherits the repository's default token permissions, which
# can be read/write -- a compromised dependency or action would then run with a
# token able to push code and publish packages.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - run: go test ./...

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - run: tests/e2e/run.sh

  race:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - run: go test -race ./...

  fuzz-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - run: scripts/fuzz-smoke.sh

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - name: Build binaries
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=.exe; fi
          go build -o "dist/ntwire${suffix}" ./cmd/ntwire
          go build -o "dist/ntwire-server${suffix}" ./cmd/ntwire-server
          # ntwire-gui only for linux/windows here: this job runs every row
          # on ubuntu-latest, and unlike the two builds above,
          # internal/gui/tray needs cgo (Cocoa) on darwin -- which this
          # runner has no macOS SDK to cross-compile against. The
          # "gui-darwin-build-check" job below covers darwin separately,
          # natively, on macos-latest.
          if [ "$GOOS" != darwin ]; then
            gui_ldflags=""
            if [ "$GOOS" = windows ]; then gui_ldflags="-H=windowsgui"; fi
            go build -ldflags "$gui_ldflags" -o "dist/ntwire-gui${suffix}" ./cmd/ntwire-gui
          fi
      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ntwire-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  gui-darwin-build-check:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      # Native build (default CGO_ENABLED=1, host arch): internal/gui/tray
      # needs Cocoa cgo on darwin, so this is what actually catches a
      # broken darwin build per-PR -- the ubuntu-hosted `build` job above
      # can't, since it has no macOS SDK to cross-compile against.
      - run: go build ./cmd/ntwire-gui
      - run: go test ./internal/gui/...
