name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: stable}
      - run: go test ./...
      - run: GOOS=linux GOARCH=amd64 go build ./cmd/...
      - run: GOOS=darwin GOARCH=arm64 go build ./cmd/...
      - run: GOOS=windows GOARCH=amd64 go build ./cmd/...
