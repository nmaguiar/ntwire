name: Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version: stable}
      - run: go test ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # GoReleaser derives the release version from the tag and uploads the
      # archives to that tag's GitHub Release. Keep the tags available here;
      # a shallow checkout can otherwise publish images while skipping assets.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version: stable}
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
  # ntwire-gui's darwin build is not part of the `binaries` job above:
  # internal/gui/tray needs Cocoa cgo there, which the ubuntu-hosted
  # goreleaser job has no macOS SDK to cross-compile against (see
  # .goreleaser.yaml's ntwire-gui entry, linux/windows only). This job
  # builds it natively on macos-latest, wraps it in the unsigned .app
  # bundle packaging/darwin/build-app.sh assembles, and uploads it to the
  # same release `binaries` already created.
  gui-darwin:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version: stable}
      - name: Build
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -ldflags "-s -w -X github.com/nmaguiar/ntwire/pkg/buildinfo.Version=${GITHUB_REF_NAME#v}" \
            -o dist/ntwire-gui ./cmd/ntwire-gui
      - name: Assemble .app bundle
        run: |
          packaging/darwin/build-app.sh dist/ntwire-gui "${GITHUB_REF_NAME#v}" dist
          ditto -c -k --sequesterRsrc --keepParent dist/ntwire-gui.app \
            "dist/ntwire-gui_${GITHUB_REF_NAME}_darwin_${{ matrix.arch }}.zip"
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/ntwire-gui_${GITHUB_REF_NAME}_darwin_${{ matrix.arch }}.zip" --clobber

  helm-chart:
    # Package the same chart that operators can inspect in the source tree.
    # The chart appVersion makes its default images match the release tag.
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Lint and package chart
        run: |
          mkdir -p dist
          helm lint deploy/helm/ntwire
          helm package deploy/helm/ntwire --destination dist \
            --version "${GITHUB_REF_NAME#v}" \
            --app-version "${GITHUB_REF_NAME#v}"
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/ntwire-*.tgz --clobber

  images:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: deploy/docker/Dockerfile
            image: ntwire-server
          - dockerfile: deploy/docker/Dockerfile.client
            image: ntwire-client
          - dockerfile: deploy/docker/Dockerfile.relay
            image: ntwire-relay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Resolve release version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: {username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}"}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            nmaguiar/${{ matrix.image }}:${{ steps.version.outputs.value }}
            nmaguiar/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
