name: Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: stable}
      - run: go test ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # GoReleaser derives the release version from the tag and uploads the
      # archives to that tag's GitHub Release. Keep the tags available here;
      # a shallow checkout can otherwise publish images while skipping assets.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with: {go-version: stable}
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
  # ntwire-gui's darwin build is not part of the `binaries` job above:
  # internal/gui/tray needs Cocoa cgo there, which the ubuntu-hosted
  # goreleaser job has no macOS SDK to cross-compile against (see
  # .goreleaser.yaml's ntwire-gui entry, linux/windows only). This job
  # builds it natively on macos-latest, wraps it in the unsigned .app
  # bundle packaging/darwin/build-app.sh assembles, and uploads it to the
  # same release `binaries` already created.
  gui-darwin:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: macos-13
          - arch: arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: stable}
      - name: Build
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -ldflags "-s -w -X github.com/nmaguiar/ntwire/pkg/buildinfo.Version=${GITHUB_REF_NAME#v}" \
            -o dist/ntwire-gui ./cmd/ntwire-gui
      - name: Assemble .app bundle
        run: |
          packaging/darwin/build-app.sh dist/ntwire-gui "${GITHUB_REF_NAME#v}" dist
          ditto -c -k --sequesterRsrc --keepParent dist/ntwire-gui.app \
            "dist/ntwire-gui_${GITHUB_REF_NAME}_darwin_${{ matrix.arch }}.zip"
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/ntwire-gui_${GITHUB_REF_NAME}_darwin_${{ matrix.arch }}.zip" --clobber

  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: deploy/docker/Dockerfile
            image: ntwire-server
          - dockerfile: deploy/docker/Dockerfile.client
            image: ntwire-client
          - dockerfile: deploy/docker/Dockerfile.relay
            image: ntwire-relay
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}
