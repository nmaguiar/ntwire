# Generate a Badgen badge from the counts of the scan used by the report.
todo:
- Create badge

ojob:
  opacks:
  - openaf: 20230520
  - Badgen: 20230603
  templateArgs: true

include:
- badgen.yaml

jobs:
- name: Create badge
  exec: |
    var entries = []
    if (isString(args.directory)) {
      entries = io.listFiles(args.directory).files.filter(f => /^binary-.*\.counts\.json$/.test(f.filename)).map(f => {
        var name = f.filename.replace(/\.counts\.json$/, "")
        return { input: args.directory + "/" + f.filename, file: args.directory + "/" + name + ".svg", label: name.replace(/^binary-/, "") }
      })
      if (entries.length === 0) throw "No binary counts found"
    } else {
      if (!isString(args.input) || !isString(args.file) || !isString(args.label)) throw "Missing badge input, file or label"
      entries = [args]
    }
    entries.forEach(entry => {
      var counts = io.readFileJSON(entry.input)
      ;["CRITICAL", "HIGH", "MEDIUM", "LOW"].forEach(level => {
        if (typeof counts[level] !== "number" || counts[level] < 0) throw "Invalid severity count: " + level
    })
    entry.status = "(CRIT: " + counts.CRITICAL + ", HIGH: " + counts.HIGH + ", MED: " + counts.MEDIUM + ", LOW: " + counts.LOW + ")"
    if (counts.UNKNOWN > 0) entry.status = entry.status.slice(0, -1) + ", UNKNOWN: " + counts.UNKNOWN + ")"
    entry.color = counts.CRITICAL > 0 ? "red" : counts.HIGH > 0 ? "orange" : counts.MEDIUM > 0 || counts.UNKNOWN > 0 ? "yellow" : counts.LOW > 0 ? "yellowgreen" : "green"
    entry.labelColor = "grey3"
    entry.icon = "nattrmon.svg"
    $job("Badgen generate file", entry)
    })
