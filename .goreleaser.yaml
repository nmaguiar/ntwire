version: 2
builds:
  - id: ntwire
    main: ./cmd/ntwire
    binary: ntwire
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X github.com/nmaguiar/ntwire/pkg/buildinfo.Version={{ .Version }}"]
  - id: ntwire-server
    main: ./cmd/ntwire-server
    binary: ntwire-server
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X github.com/nmaguiar/ntwire/pkg/buildinfo.Version={{ .Version }}"]
  - id: ntwire-relay
    main: ./cmd/ntwire-relay
    binary: ntwire-relay
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X github.com/nmaguiar/ntwire/pkg/buildinfo.Version={{ .Version }}"]
  # ntwire-gui, linux/windows only: unlike the three builds above, its tray
  # (fyne.io/systray) needs cgo on darwin (Cocoa) -- but is verified pure Go
  # on linux (DBus StatusNotifierItem, see internal/gui/tray's package doc)
  # and needs no cgo at all on windows. That split is exactly why this
  # entry excludes darwin rather than listing all three: goreleaser's
  # ubuntu-hosted release job that builds everything else here has no
  # macOS SDK to cross-compile Cocoa cgo against. The darwin build (and its
  # .app bundle) is produced separately, on a macos-latest runner, by
  # release.yml's "gui-darwin" job -- see packaging/darwin/build-app.sh.
  - id: ntwire-gui-linux
    main: ./cmd/ntwire-gui
    binary: ntwire-gui
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X github.com/nmaguiar/ntwire/pkg/buildinfo.Version={{ .Version }}"]
  # A GUI-subsystem executable does not allocate a command prompt when the
  # tray application starts from Explorer or at login. Keep this separate
  # from the Linux build so the Windows-specific linker flag is explicit.
  - id: ntwire-gui-windows
    main: ./cmd/ntwire-gui
    binary: ntwire-gui
    goos: [windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -H=windowsgui -X github.com/nmaguiar/ntwire/pkg/buildinfo.Version={{ .Version }}"]
# Pin the checksum manifest's name and algorithm: web/get*.sh and web/get*.bat
# look for exactly "checksums.txt" and refuse to install without it, so this is
# part of the install path's contract rather than a GoReleaser default that
# could change under it.
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

archives:
  # Publish the client, server, and relay as separate downloadable assets. Docker
  # images are a deployment alternative, not a replacement for these binaries.
  - id: ntwire
    ids: [ntwire]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides: [{goos: windows, format: zip}]
  - id: ntwire-server
    ids: [ntwire-server]
    name_template: "{{ .ProjectName }}-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides: [{goos: windows, format: zip}]
  - id: ntwire-relay
    ids: [ntwire-relay]
    name_template: "{{ .ProjectName }}-relay_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides: [{goos: windows, format: zip}]
  - id: ntwire-gui
    ids: [ntwire-gui-linux, ntwire-gui-windows]
    name_template: "{{ .ProjectName }}-gui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides: [{goos: windows, format: zip}]
