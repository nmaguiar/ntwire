version: 2
builds:
  - id: ntwire
    main: ./cmd/ntwire
    binary: ntwire
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X github.com/nmaguiar/ntwire/pkg/buildinfo.Version={{ .Version }}"]
  - id: ntwire-server
    main: ./cmd/ntwire-server
    binary: ntwire-server
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X github.com/nmaguiar/ntwire/pkg/buildinfo.Version={{ .Version }}"]
archives:
  # Publish the client and server as separate downloadable assets. Docker
  # images are a deployment alternative, not a replacement for these binaries.
  - id: ntwire
    ids: [ntwire]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides: [{goos: windows, format: zip}]
  - id: ntwire-server
    ids: [ntwire-server]
    name_template: "{{ .ProjectName }}-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides: [{goos: windows, format: zip}]
