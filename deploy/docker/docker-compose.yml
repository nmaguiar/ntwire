services:
  ntwire-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["--config", "/etc/ntwire/ntwire.yaml"]
    ports: ["8443:8443", "51820:51820/udp"]
    volumes:
      - ./ntwire.yaml:/etc/ntwire/ntwire.yaml:ro
      - ./keys:/etc/ntwire/keys:ro
  example:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:8080", "-text=ntwire-ok"]
