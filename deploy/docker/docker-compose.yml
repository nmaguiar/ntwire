services:
  nwire-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["--config", "/etc/nwire/nwire.yaml"]
    ports: ["8443:8443", "51820:51820/udp"]
    volumes:
      - ./nwire.yaml:/etc/nwire/nwire.yaml:ro
      - ./keys:/etc/nwire/keys:ro
  echo:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:8080", "-text=nwire-ok"]
