apiVersion: v1
kind: ServiceAccount
metadata:
  name: ntwire-relay
  namespace: ntwire-system
---
# Cluster-wide discovery. For selected namespaces, replace this ClusterRole
# binding with Role/RoleBinding pairs in only those namespaces (Services) and
# retain a narrowly scoped Namespace watch only when namespace selectors are used.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ntwire-relay-discovery
rules:
  - apiGroups: [""]
    resources: ["services", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ntwire-relay-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ntwire-relay-discovery
subjects:
  - kind: ServiceAccount
    name: ntwire-relay
    namespace: ntwire-system
