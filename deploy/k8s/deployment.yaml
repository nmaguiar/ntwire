apiVersion: apps/v1
kind: Deployment
metadata: {name: ntwire-server}
spec:
  replicas: 1
  selector: {matchLabels: {app: ntwire-server}}
  template:
    metadata: {labels: {app: ntwire-server}}
    spec:
      volumes:
        - name: config
          configMap: {name: ntwire-config}
        - name: keys
          secret: {secretName: ntwire-authorized-keys}
      containers:
        - name: server
          image: nmaguiar/ntwire-server:build
          args: [--config, /etc/ntwire/ntwire.yaml]
          securityContext: {runAsNonRoot: true, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false}
          ports: [{containerPort: 8443, name: https}, {containerPort: 51820, name: wireguard, protocol: UDP}]
          volumeMounts: [{name: config, mountPath: /etc/ntwire/ntwire.yaml, subPath: ntwire.yaml, readOnly: true}, {name: keys, mountPath: /etc/ntwire/keys, readOnly: true}]
