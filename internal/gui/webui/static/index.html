<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ntwire settings</title>
<style>
:root{color-scheme:light dark;--bg:#f7f9fc;--panel:#fff;--panel-2:#eef4ff;--text:#162033;--muted:#607089;--brand:#246bfe;--brand-strong:#174fc5;--accent:#10a37f;--danger:#c2410c;--danger-strong:#9a3412;--border:#d9e2f1;--shadow:0 20px 60px rgba(22,32,51,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--panel:#111a2e;--panel-2:#15223a;--text:#edf4ff;--muted:#9fb0ca;--brand:#79a7ff;--brand-strong:#a9c5ff;--accent:#4ade80;--danger:#fb923c;--danger-strong:#fdba74;--border:#263753;--shadow:0 20px 60px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:var(--bg)}
main{width:min(64rem,calc(100% - 2rem));margin:0 auto;padding:2.5rem 0}
h1{font-size:1.9rem;margin:0 0 .25rem}
.lede{color:var(--muted);margin:0 0 1.5rem}
.panel{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:1.25rem;margin-bottom:1.25rem}
.row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.row + .row{margin-top:.6rem}
h2{font-size:1.1rem;margin:0 0 .75rem}
.profile{display:flex;align-items:center;gap:.75rem;padding:.7rem 0;border-bottom:1px solid var(--border)}
.profile:last-child{border-bottom:none}
.profile .name{font-weight:700}
.profile .server{color:var(--muted);font:600 .85rem ui-monospace,SFMono-Regular,Consolas,monospace}
.profile .info{flex:1;min-width:0}
.badge{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--border);border-radius:999px;padding:.25rem .6rem;font-size:.78rem;font-weight:700;background:var(--panel-2)}
.badge::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:var(--muted)}
.badge.connected::before,.badge.reconnecting::before{background:var(--accent)}
.badge.failed::before,.badge.awaiting_trust::before,.badge.awaiting_passphrase::before{background:var(--danger)}
button{border:0;border-radius:10px;background:var(--brand);color:var(--bg);padding:.5rem .8rem;font-weight:700;font-size:.85rem;cursor:pointer}
button.secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--border)}
button.danger{background:var(--danger)}
button:hover,button:focus-visible{filter:brightness(1.08)}
button:disabled{cursor:not-allowed;opacity:.5}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);padding:.5rem .6rem;font:inherit}
textarea{min-height:4.5rem;font:.85rem ui-monospace,SFMono-Regular,Consolas,monospace}
label{display:grid;gap:.3rem;font-size:.85rem;color:var(--muted);margin-bottom:.75rem}
label.toggle{display:flex;flex-direction:row;align-items:center;gap:.5rem;font-size:.9rem;color:var(--text)}
label.toggle input{width:auto}
fieldset{border:1px solid var(--border);border-radius:12px;padding:.9rem;margin:0 0 .9rem}
legend{padding:0 .4rem;color:var(--muted);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.help{color:var(--muted);font-size:.78rem;margin:-.15rem 0 0}
#message{min-height:1.3em;color:var(--danger);font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(10,14,24,.55);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:50}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:1.5rem;max-width:32rem;width:100%}
.modal h3{margin:0 0 .5rem}
.modal.danger{border-color:var(--danger)}
.modal .fingerprint{font:600 .9rem ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:.4rem .55rem;word-break:break-all}
.modal .warn{color:var(--danger-strong);font-weight:700}
.empty{color:var(--muted)}
.hidden{display:none !important}
.unreachable-banner{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;gap:1rem;align-items:center;justify-content:center;flex-wrap:wrap;padding:.75rem 1rem;background:var(--danger);color:#fff;font-weight:700;box-shadow:var(--shadow)}
.unreachable-banner button{border:0;border-radius:10px;background:#fff;color:var(--danger);padding:.45rem .8rem;font-weight:700;font-size:.85rem;cursor:pointer}
details.advanced summary{cursor:pointer;color:var(--muted);font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:.5rem 0}
</style>
<main>
  <h1>ntwire settings</h1>
  <p class="lede">Configure server profiles for ntwire-gui. Changes here never touch the CLI's own ~/.ntwire/config.yaml.</p>
  <p id="message" role="status"></p>

  <section class="panel">
    <h2>Profiles</h2>
    <div id="profiles" class="empty">Loading…</div>
    <div class="row" style="margin-top:1rem">
      <button id="add-profile-btn">Add profile…</button>
      <button class="secondary" id="keygen-btn">Generate new identity…</button>
    </div>
  </section>

  <section class="panel hidden" id="form-panel">
    <h2 id="form-title">Add profile</h2>
    <form id="profile-form">
      <label>Name<input type="text" name="Name" required></label>
      <label>Server URL<input type="text" name="Server" placeholder="https://relay.example.com" required></label>
      <label class="toggle"><input type="checkbox" name="ConnectOnStart">Connect automatically at login</label>
      <div id="generated-fields"></div>
      <div class="row">
        <button type="submit">Save</button>
        <button type="button" class="secondary" id="cancel-form-btn">Cancel</button>
      </div>
    </form>
  </section>
</main>

<div id="modal-root"></div>

<script>
const token = new URLSearchParams(location.search).get('token');
const messageEl = document.getElementById('message');
const profilesEl = document.getElementById('profiles');
const formPanel = document.getElementById('form-panel');
const formTitle = document.getElementById('form-title');
const form = document.getElementById('profile-form');
const generatedFields = document.getElementById('generated-fields');
const modalRoot = document.getElementById('modal-root');

let schema = [];
let profiles = new Map(); // id -> Snapshot
let editingID = null; // null while the form is hidden or creating

function q(path) { return path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token); }

async function api(method, path, body) {
  const r = await fetch(q(path), {
    method,
    headers: body !== undefined ? {'Content-Type': 'application/json'} : undefined,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) throw new Error(await r.text().catch(() => r.statusText));
  const ct = r.headers.get('content-type') || '';
  return ct.includes('application/json') ? r.json() : null;
}

function setMessage(text) { messageEl.textContent = text || ''; }

function stateLabel(s) {
  switch (s) {
    case 'connected': return 'Connected';
    case 'reconnecting': return 'Reconnecting…';
    case 'connecting': return 'Connecting…';
    case 'awaiting_trust': return 'Needs trust decision';
    case 'awaiting_passphrase': return 'Needs passphrase';
    case 'failed': return 'Failed';
    default: return 'Disconnected';
  }
}

function renderProfiles() {
  const list = [...profiles.values()].sort((a, b) => a.profile.Name.localeCompare(b.profile.Name));
  if (!list.length) {
    profilesEl.className = 'empty';
    profilesEl.textContent = 'No profiles yet.';
    return;
  }
  profilesEl.className = '';
  profilesEl.replaceChildren(...list.map(renderProfileRow));
}

function renderProfileRow(snap) {
  const p = snap.profile;
  const block = document.createElement('div');
  block.className = 'profile';

  const row = document.createElement('div');
  row.className = 'row';

  const info = document.createElement('div');
  info.className = 'info';
  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = p.Name;
  const server = document.createElement('div');
  server.className = 'server';
  server.textContent = p.Server;
  info.append(name, server);

  const badge = document.createElement('span');
  badge.className = 'badge ' + snap.state;
  badge.textContent = stateLabel(snap.state) + (snap.error ? ': ' + snap.error : '');

  const connected = snap.state === 'connected' || snap.state === 'reconnecting';
  const connectBtn = document.createElement('button');
  connectBtn.className = connected ? 'secondary' : '';
  connectBtn.textContent = connected ? 'Disconnect' : 'Connect';
  connectBtn.disabled = snap.state === 'connecting';
  connectBtn.addEventListener('click', async () => {
    try {
      await api('POST', `/api/profiles/${p.ID}/${connected ? 'disconnect' : 'connect'}`);
    } catch (e) { setMessage(e.message); }
  });

  const editBtn = document.createElement('button');
  editBtn.className = 'secondary';
  editBtn.textContent = 'Edit';
  editBtn.addEventListener('click', () => openForm(p));

  const deleteBtn = document.createElement('button');
  deleteBtn.className = 'danger';
  deleteBtn.textContent = 'Delete';
  deleteBtn.disabled = connected;
  deleteBtn.title = connected ? 'Disconnect first' : '';
  deleteBtn.addEventListener('click', async () => {
    if (!confirm(`Delete profile "${p.Name}"?`)) return;
    try {
      await api('DELETE', `/api/profiles/${p.ID}`);
      profiles.delete(p.ID);
      renderProfiles();
    } catch (e) { setMessage(e.message); }
  });

  row.append(info, badge, connectBtn, editBtn, deleteBtn);

  if (p.SSO) {
    const logoutBtn = document.createElement('button');
    logoutBtn.className = 'secondary';
    logoutBtn.textContent = 'Clear SSO tokens';
    logoutBtn.addEventListener('click', async () => {
      try {
        await api('POST', `/api/profiles/${p.ID}/logout`);
        setMessage(`Cleared cached SSO tokens for "${p.Name}".`);
      } catch (e) { setMessage(e.message); }
    });
    row.append(logoutBtn);
  }

  block.append(row);
  if (connected && snap.status && snap.status.tunnels && snap.status.tunnels.length) {
    block.append(renderTunnelList(p.ID, snap.status.tunnels));
  }
  return block;
}

// renderTunnelList is the live equivalent of `ntwire port`: each row can
// PUT /api/profiles/{id}/tunnels/{name} to rebind a *running* tunnel's
// local port, distinct from the Local ports field in the edit form (which
// only takes effect on the next connect).
function renderTunnelList(profileID, tunnels) {
  const list = document.createElement('div');
  list.style.margin = '.4rem 0 0 .5rem';
  for (const t of tunnels) {
    const line = document.createElement('div');
    line.className = 'row';
    line.style.margin = '.3rem 0';
    const label = document.createElement('span');
    label.className = 'server';
    label.textContent = `${t.name} → ${t.local_address}`;
    const input = document.createElement('input');
    input.type = 'number';
    input.min = '1';
    input.max = '65535';
    input.style.width = '6rem';
    input.value = (t.local_address.split(':').pop());
    const apply = document.createElement('button');
    apply.className = 'secondary';
    apply.textContent = 'Change port';
    apply.addEventListener('click', async () => {
      try {
        await api('PUT', `/api/profiles/${profileID}/tunnels/${encodeURIComponent(t.name)}`, {local_port: Number(input.value)});
        setMessage(`Rebound "${t.name}".`);
      } catch (e) { setMessage(e.message); }
    });
    line.append(label, input, apply);
    list.append(line);
  }
  return list;
}

// --- generated form -------------------------------------------------------

function fieldControl(f, value) {
  if (f.widget === 'toggle') {
    const label = document.createElement('label');
    label.className = 'toggle';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.name = f.field;
    input.checked = !!value;
    label.append(input, f.label);
    return label;
  }
  const label = document.createElement('label');
  label.append(f.label);
  let input;
  if (f.widget === 'portmap') {
    input = document.createElement('textarea');
    input.name = f.field;
    input.placeholder = 'name=local-port, one per line';
    if (value && typeof value === 'object') {
      input.value = Object.entries(value).map(([k, v]) => `${k}=${v}`).join('\n');
    }
  } else {
    input = document.createElement('input');
    input.type = 'text';
    input.name = f.field;
    if (value !== undefined && value !== null) input.value = value;
  }
  label.append(input);
  if (f.help) {
    const help = document.createElement('p');
    help.className = 'help';
    help.textContent = f.help;
    label.append(help);
  }
  return label;
}

// previewTunnels calls the profile's /probe endpoint (client.Options.
// QueryOnly -- authenticates and reports what the server would grant
// without occupying a max_sessions_per_key slot, ntwire-gui's equivalent
// of `ntwire list`) and shows the tunnel names it's allowed, so the Local
// ports field can be filled in with real names instead of guessed ones.
async function previewTunnels(id) {
  try {
    const tunnels = await api('POST', `/api/profiles/${id}/probe`);
    if (!tunnels.length) { alert('The server granted no tunnels to this identity.'); return; }
    alert('Available tunnels:\n' + tunnels.map(t => `${t.name} (virtual port ${t.virtual_port})`).join('\n'));
  } catch (e) { setMessage(e.message); }
}

function renderGeneratedFields(profile) {
  generatedFields.replaceChildren();
  const groups = new Map();
  for (const f of schema) {
    if (!groups.has(f.group)) groups.set(f.group, []);
    groups.get(f.group).push(f);
  }
  for (const [group, fields] of groups) {
    const basic = fields.filter(f => !f.advanced);
    const advanced = fields.filter(f => f.advanced);
    if (basic.length) {
      const fs = document.createElement('fieldset');
      const legend = document.createElement('legend');
      legend.textContent = group;
      fs.append(legend);
      basic.forEach(f => fs.append(fieldControl(f, profile ? profile[f.field] : undefined)));
      if (group === 'Tunnels' && profile) {
        const preview = document.createElement('button');
        preview.type = 'button';
        preview.className = 'secondary';
        preview.textContent = 'Preview tunnels…';
        preview.addEventListener('click', () => previewTunnels(profile.ID));
        fs.append(preview);
      }
      generatedFields.append(fs);
    }
    if (advanced.length) {
      const details = document.createElement('details');
      details.className = 'advanced';
      const summary = document.createElement('summary');
      summary.textContent = group + ' (advanced)';
      details.append(summary);
      const fs = document.createElement('fieldset');
      advanced.forEach(f => fs.append(fieldControl(f, profile ? profile[f.field] : undefined)));
      details.append(fs);
      generatedFields.append(details);
    }
  }
}

function openForm(profile) {
  editingID = profile ? profile.ID : null;
  formTitle.textContent = profile ? `Edit ${profile.Name}` : 'Add profile';
  form.Name.value = profile ? profile.Name : '';
  form.Server.value = profile ? profile.Server : '';
  form.ConnectOnStart.checked = !!(profile && profile.ConnectOnStart);
  renderGeneratedFields(profile);
  formPanel.classList.remove('hidden');
  formPanel.scrollIntoView({behavior: 'smooth'});
}

function closeForm() {
  editingID = null;
  form.reset();
  formPanel.classList.add('hidden');
}

function parsePortMap(text) {
  const out = {};
  for (const line of (text || '').split('\n')) {
    const t = line.trim();
    if (!t) continue;
    const i = t.indexOf('=');
    if (i < 0) throw new Error(`invalid port mapping ${JSON.stringify(t)}, want name=port`);
    const port = Number(t.slice(i + 1));
    if (!Number.isInteger(port) || port < 1 || port > 65535) throw new Error(`invalid port in ${JSON.stringify(t)}`);
    out[t.slice(0, i)] = port;
  }
  return out;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  setMessage('');
  try {
    const body = {
      Name: form.Name.value,
      Server: form.Server.value,
      ConnectOnStart: form.ConnectOnStart.checked,
    };
    for (const f of schema) {
      const el = form.elements[f.field];
      if (!el) continue;
      if (f.widget === 'toggle') body[f.field] = el.checked;
      else if (f.widget === 'portmap') body[f.field] = parsePortMap(el.value);
      else body[f.field] = el.value;
    }
    if (editingID) {
      await api('PUT', `/api/profiles/${editingID}`, body);
    } else {
      await api('POST', '/api/profiles', body);
    }
    closeForm();
    await refreshProfiles();
  } catch (err) {
    setMessage(err.message);
  }
});

document.getElementById('add-profile-btn').addEventListener('click', () => openForm(null));
document.getElementById('cancel-form-btn').addEventListener('click', closeForm);

document.getElementById('keygen-btn').addEventListener('click', async () => {
  const path = prompt('Output path for the new private key:', '~/.ntwire/id_ed25519');
  if (!path) return;
  try {
    const result = await api('POST', '/api/keygen', {path});
    alert(`Identity created.\nFingerprint: ${result.fingerprint}\n\nPublic key:\n${result.public_key}`);
  } catch (e) { setMessage(e.message); }
});

// --- prompts (trust / passphrase) -----------------------------------------

// promptKey identifies not just which profile has a pending prompt but
// which prompt -- a connect attempt goes passphrase-prompt first, then
// (only after that's answered) a possible trust prompt, so keying on
// profile ID alone can keep showing a stale passphrase modal if the
// intermediate "prompt cleared" update is dropped. Manager.Subscribe's
// channel is explicitly best-effort (16-slot buffer), so that drop is a
// real possibility under a burst of updates, not just a theoretical one.
function promptKey(snap) {
  const p = snap.prompt;
  return `${snap.profile.ID}:${p.kind}:${p.fingerprint || p.key_path || ''}`;
}

let currentPromptKey = null;

function renderPrompts() {
  const withPrompt = [...profiles.values()].find(s => s.prompt);
  if (!withPrompt) {
    if (currentPromptKey) { modalRoot.replaceChildren(); currentPromptKey = null; }
    return;
  }
  const key = promptKey(withPrompt);
  if (currentPromptKey === key) return; // already showing this exact prompt
  currentPromptKey = key;
  modalRoot.replaceChildren(withPrompt.prompt.kind === 'trust'
    ? trustModal(withPrompt)
    : passphraseModal(withPrompt));
}

function overlay(content) {
  const o = document.createElement('div');
  o.className = 'overlay';
  o.append(content);
  return o;
}

function trustModal(snap) {
  const p = snap.prompt;
  const changed = !!p.previous;
  const modal = document.createElement('div');
  modal.className = 'modal' + (changed ? ' danger' : '');
  const h = document.createElement('h3');
  h.textContent = changed ? '⚠ Server fingerprint changed' : 'Unknown server';
  const body = document.createElement('div');
  if (changed) {
    const warn = document.createElement('p');
    warn.className = 'warn';
    warn.textContent = `The certificate ntwire has on file for "${p.host}" (profile "${snap.profile.Name}") does not match what the server presented just now. This can mean the server was reinstalled -- or that something is intercepting the connection.`;
    body.append(warn);
  } else {
    const intro = document.createElement('p');
    intro.textContent = `"${p.host}" (profile "${snap.profile.Name}") has not been connected to before. Verify its fingerprint out-of-band before trusting it.`;
    body.append(intro);
  }
  const fp = document.createElement('div');
  fp.className = 'fingerprint';
  fp.textContent = p.fingerprint;
  body.append(fp);

  const actions = document.createElement('div');
  actions.className = 'row';
  actions.style.marginTop = '1rem';
  const reject = document.createElement('button');
  reject.className = changed ? '' : 'secondary';
  reject.textContent = 'Reject';
  reject.addEventListener('click', () => answerTrust(snap.profile.ID, false));
  const trust = document.createElement('button');
  trust.className = changed ? 'danger' : '';
  trust.textContent = changed ? 'Trust anyway (dangerous)' : 'Trust and connect';
  trust.addEventListener('click', () => answerTrust(snap.profile.ID, true));
  // On a changed pin, Reject is the safe default -- render it first and
  // give Trust no visual precedence, rather than the usual primary button.
  actions.append(...(changed ? [reject, trust] : [trust, reject]));

  modal.append(h, body, actions);
  return overlay(modal);
}

async function answerTrust(id, trust) {
  try {
    await api('POST', `/api/prompts/${id}/trust`, {trust});
  } catch (e) { setMessage(e.message); }
}

function passphraseModal(snap) {
  const p = snap.prompt;
  const modal = document.createElement('div');
  modal.className = 'modal';
  const h = document.createElement('h3');
  h.textContent = `Passphrase needed for "${snap.profile.Name}"`;
  const desc = document.createElement('p');
  desc.textContent = `The identity key at ${p.key_path} is encrypted. Enter its passphrase to connect; it is never stored.`;
  const label = document.createElement('label');
  const input = document.createElement('input');
  input.type = 'password';
  input.autofocus = true;
  label.append('Passphrase', input);

  const actions = document.createElement('div');
  actions.className = 'row';
  actions.style.marginTop = '1rem';
  const connect = document.createElement('button');
  connect.textContent = 'Connect';
  connect.addEventListener('click', () => answerPassphrase(snap.profile.ID, input.value, false));
  const cancel = document.createElement('button');
  cancel.className = 'secondary';
  cancel.textContent = 'Cancel';
  cancel.addEventListener('click', () => answerPassphrase(snap.profile.ID, '', true));
  actions.append(connect, cancel);

  modal.append(h, desc, label, actions);
  return overlay(modal);
}

async function answerPassphrase(id, passphrase, cancel) {
  try {
    await api('POST', `/api/prompts/${id}/passphrase`, {passphrase, cancel});
  } catch (e) { setMessage(e.message); }
}

// --- data loading -----------------------------------------------------------

async function refreshProfiles() {
  const list = await api('GET', '/api/profiles');
  profiles = new Map(list.map(s => [s.profile.ID, s]));
  renderProfiles();
  renderPrompts();
}

async function refreshSchema() {
  schema = await api('GET', '/api/schema');
}

const maxEventFailures = 5;

function showUnreachable() {
  if (document.querySelector('.unreachable-banner')) return;
  const banner = document.createElement('div');
  banner.className = 'unreachable-banner';
  const text = document.createElement('span');
  text.textContent = `Lost contact with the ntwire background process after ${maxEventFailures} attempts. You can close this tab.`;
  const closeBtn = document.createElement('button');
  closeBtn.textContent = 'Close tab';
  closeBtn.addEventListener('click', () => window.close());
  banner.append(text, closeBtn);
  document.body.prepend(banner);
  window.close();
}

function connectEvents() {
  let failures = 0;
  const es = new EventSource(q('/api/events'));
  es.onopen = () => { failures = 0; };
  es.onmessage = (ev) => {
    failures = 0;
    try {
      const update = JSON.parse(ev.data);
      profiles.set(update.ProfileID, update.Snapshot);
      renderProfiles();
      renderPrompts();
    } catch {}
  };
  es.onerror = () => {
    // EventSource retries on its own; give up only after repeated failures.
    failures++;
    if (failures >= maxEventFailures) {
      es.close();
      showUnreachable();
    }
  };
}

(async function init() {
  try {
    await refreshSchema();
    await refreshProfiles();
  } catch (e) {
    setMessage('Could not load settings: ' + e.message);
  }
  connectEvents();
})();
</script>
